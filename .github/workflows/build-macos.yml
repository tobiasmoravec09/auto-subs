name: Build macOS

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  TAURI_VERSION: "2"

permissions:
  contents: read

jobs:
  build-intel:
    name: Build macOS Intel (x86_64)
    runs-on: macos-13
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: AutoSubs-App/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: AutoSubs-App/src-tauri -> target
          key: cargo-${{ runner.os }}-x86_64-${{ hashFiles('AutoSubs-App/src-tauri/Cargo.lock') }}

      - name: Install frontend dependencies
        working-directory: AutoSubs-App
        run: npm ci

      - name: Build frontend
        working-directory: AutoSubs-App
        run: npm run build:web

      - name: Build Tauri app (Intel)
        working-directory: AutoSubs-App
        run: npm run build:mac:x86_64

      - name: Upload macOS Intel DMG
        uses: actions/upload-artifact@v4
        with:
          name: AutoSubs-macOS-Intel-DMG
          path: AutoSubs-App/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30

      - name: Upload macOS Intel App
        uses: actions/upload-artifact@v4
        with:
          name: AutoSubs-macOS-Intel-App
          path: AutoSubs-App/src-tauri/target/release/bundle/macos/*.app
          retention-days: 30

  build-arm:
    name: Build macOS Apple Silicon (ARM64)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: AutoSubs-App/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: AutoSubs-App/src-tauri -> target
          key: cargo-${{ runner.os }}-aarch64-${{ hashFiles('AutoSubs-App/src-tauri/Cargo.lock') }}

      - name: Install frontend dependencies
        working-directory: AutoSubs-App
        run: npm ci

      - name: Build frontend
        working-directory: AutoSubs-App
        run: npm run build:web

      - name: Build Tauri app (ARM64)
        working-directory: AutoSubs-App
        run: npm run build:mac:arm64

      - name: Upload macOS ARM64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: AutoSubs-macOS-ARM64-DMG
          path: AutoSubs-App/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30

      - name: Upload macOS ARM64 App
        uses: actions/upload-artifact@v4
        with:
          name: AutoSubs-macOS-ARM64-App
          path: AutoSubs-App/src-tauri/target/release/bundle/macos/*.app
          retention-days: 30